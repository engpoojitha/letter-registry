services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      PORT: 3003
      DATA_FILE: /data/data.json
      MAX_BODY_BYTES: 52428800
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "3005:80"
    restart: unless-stopped
