<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DE Office Battaramulla – Letter Management System</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#0a1628;--navy2:#102040;--blue:#1a56db;--blue2:#1e40af;--accent:#3b82f6;
  --gold:#f59e0b;--green:#059669;--red:#dc2626;--purple:#7c3aed;--orange:#ea580c;
  --bg:#f1f5fb;--surface:#ffffff;--surface2:#f8fafc;--border:#dde3ef;--border2:#e8edf5;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --font:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
  --r:8px;--r2:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
  --shadow2:0 4px 24px rgba(10,22,40,.12),0 1px 4px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:var(--font);font-size:14px}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#f1f5fb}
::-webkit-scrollbar-thumb{background:#c4d0e8;border-radius:3px}

/* LAYOUT */
.page-wrap{max-width:1300px;margin:0 auto;padding:20px 16px}
.card{background:var(--surface);border-radius:var(--r2);box-shadow:var(--shadow);border:1px solid var(--border2)}
.card-body{padding:22px 24px}

/* FORM ELEMENTS */
.lbl{display:block;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.inp{display:block;width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--r);font-size:13px;color:var(--text);background:#fff;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--blue)}
.inp:read-only{background:var(--surface2);color:var(--text3)}
.fg{margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.span2{grid-column:span 2}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--r);font-weight:600;font-size:13px;transition:all .15s;white-space:nowrap}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--blue);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--text2)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue);opacity:1}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:6px}
.btn-gold{background:var(--gold);color:#fff}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.badge-pending_de{background:#fff3e0;color:#e65100;border:1px solid #ffcc80}
.badge-de_reviewed{background:#e3f2fd;color:#1565c0;border:1px solid #90caf9}
.badge-ongoing{background:#f3e5f5;color:#6a1b9a;border:1px solid #ce93d8}
.badge-done{background:#e8f5e9;color:#1b5e20;border:1px solid #a5d6a7}
.badge-attended{background:#e0f7fa;color:#006064;border:1px solid #80deea}
.badge-pending{background:#f5f5f5;color:#616161;border:1px solid #e0e0e0}

/* ALERTS */
.alert{padding:11px 14px;border-radius:var(--r);font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.alert-info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.alert-warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert-err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.alert-ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(10,22,40,.55);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:var(--r2);width:100%;max-width:780px;box-shadow:var(--shadow2);margin:auto;max-height:92vh;display:flex;flex-direction:column;animation:mIn .2s ease}
@keyframes mIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.modal-hd{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--navy);border-radius:var(--r2) var(--r2) 0 0;flex-shrink:0}
.modal-title{color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.modal-close{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:3px 10px;font-size:16px;line-height:1}
.modal-body{padding:22px 24px;overflow-y:auto;flex:1}

/* TOP NAV */
.topnav{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);box-shadow:0 2px 12px rgba(10,22,40,.3);position:sticky;top:0;z-index:100}
.topnav-bar{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.nav-logo{color:#fff;font-weight:800;font-size:15px;letter-spacing:-.2px}
.nav-sub{color:rgba(255,255,255,.35);font-size:11px;margin-top:1px}
.nav-user{text-align:right}
.nav-user-name{color:#fff;font-size:12px;font-weight:600}
.nav-user-role{color:rgba(255,255,255,.4);font-size:11px}
.nav-tabs{display:flex;padding:0 16px;overflow-x:auto;gap:2px}
.nav-tab{padding:9px 16px;background:transparent;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.55);font-weight:500;font-size:13px;transition:all .15s;white-space:nowrap}
.nav-tab.active{color:#fff;border-bottom-color:var(--accent);background:rgba(255,255,255,.07)}
.nav-tab:hover:not(.active){color:#fff;background:rgba(255,255,255,.05)}
.notif-btn{position:relative;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:var(--r);padding:6px 12px;font-size:13px}
.notif-dot{position:absolute;top:-5px;right:-5px;background:#ef4444;color:#fff;border-radius:20px;font-size:10px;font-weight:800;min-width:18px;padding:1px 4px;text-align:center}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border2)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f8fafc}
tbody tr{cursor:pointer;transition:background .1s}

/* STAT CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:22px}
.stat-card{background:#fff;border-radius:var(--r2);padding:16px 18px;border:1px solid var(--border2);box-shadow:var(--shadow);border-left:3px solid transparent;transition:all .2s;cursor:default}
.stat-card.clickable{cursor:pointer}
.stat-card.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.stat-val{font-size:32px;font-weight:800;font-family:var(--mono);line-height:1}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:5px;font-weight:500}
.stat-hint{font-size:10px;color:var(--text3);margin-top:2px}

/* FILE UPLOAD */
.drop-zone{border:2px dashed var(--border);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface2)}
.drop-zone:hover,.drop-zone.drag{border-color:var(--blue);background:#eff6ff}
.drop-icon{font-size:24px;margin-bottom:6px}
.drop-text{font-size:13px;color:var(--text2);font-weight:500}
.drop-hint{font-size:11px;color:var(--text3);margin-top:3px}
.file-chip{display:inline-flex;align-items:center;gap:5px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:16px;padding:3px 10px;font-size:11px;font-weight:500;color:var(--blue2);margin:3px}
.file-chip-rm{background:none;border:none;color:var(--red);font-size:14px;font-weight:700;padding:0;line-height:1}

/* ASSIGN TAG */
.assign-tag{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;background:#fff;cursor:pointer;transition:all .15s;margin:3px}
.assign-tag.sel{border-color:var(--blue);background:#eff6ff;color:var(--blue2);font-weight:600}

/* DRIVE LINK HINT */
.drive-hint{background:#e8f5e9;border:1px solid #a5d6a7;border-radius:var(--r);padding:10px 13px;font-size:12px;color:#1b5e20;margin-top:8px}

/* TOAST */
.toast-container{position:fixed;right:18px;bottom:20px;z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#0f172a;color:#fff;border-radius:var(--r);padding:10px 16px;font-size:13px;font-weight:500;box-shadow:var(--shadow2);display:flex;align-items:center;gap:10px;animation:tIn .25s ease;max-width:360px;pointer-events:auto}
.toast.err{background:#dc2626}
.toast.ok{background:#059669}
@keyframes tIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* DIVIDER */
.divider{height:1px;background:var(--border2);margin:18px 0}

/* USER CARD */
.user-card{background:#fff;border:1px solid var(--border2);border-radius:var(--r);padding:13px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;transition:background .15s}
.user-card:hover{background:var(--surface2)}

/* SAVING INDICATOR */
.saving-bar{position:fixed;top:0;left:0;right:0;z-index:999;height:3px;background:linear-gradient(90deg,var(--blue),var(--accent),var(--blue));background-size:200%;animation:progress 1.2s linear infinite}
@keyframes progress{from{background-position:200% 0}to{background-position:-200% 0}}

/* SEEN INDICATOR */
.seen-yes{color:#059669;font-size:11px;font-weight:600}
.seen-no{color:#dc2626;font-size:11px;font-weight:600}

/* PRINT */
@media print{.topnav,.btn,.overlay,.toast-container,.saving-bar{display:none!important}.card{box-shadow:none;border:1px solid #ccc}}

/* RESPONSIVE */
@media(max-width:640px){.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}.span2{grid-column:span 1}}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// CONSTANTS & CONFIG
// ═══════════════════════════════════════════════════════════════════════════
const DRIVE_FOLDER = "https://drive.google.com/drive/folders/1k85Zb_yZoL9aGYQ9RZQhspQrnNjXW_Sb";
const LS_STATE  = "lms_state_v6";
const LS_USERS  = "lms_users_v6";
const LS_SESSION = "lms_session_v6";

const STATUS_LABELS = {
  pending_de:  "Pending DE Review",
  de_reviewed: "DE Reviewed",
  ongoing:     "Ongoing",
  done:        "Done",
  attended:    "Attended",
  pending:     "Pending"
};

const STATUS_COLORS = {
  pending_de:  "#e65100",
  de_reviewed: "#1565c0",
  ongoing:     "#6a1b9a",
  done:        "#1b5e20",
  attended:    "#006064",
  pending:     "#616161"
};

const FROM_OPTS = [
  "DCS Engineering","Director Building","Director Engineering",
  "Ministry of Provincial Councils","Divisional Secretariat","Local Government","Others"
];
const TO_IN_OPTS = [
  "DE","CC","MO1","MO2","MO3","MO4","DO1","DO2",
  "STO KADUWELA","STO MAHARAGAMA","STO NUGEGODA","STO KOLONNAWA","Others"
];
const OUT_TO_OPTS = [
  "DCS Engineering","Director Building","Director Engineering",
  "Ministry of Provincial Councils","Divisional Secretariat","Local Government","Others"
];

const DEFAULT_USERS = [
  {u:"DE",     d:"Divisional Engineer",    r:"DE",  pw:"de2024"},
  {u:"CC",     d:"Chief Clerk",            r:"CC",  pw:"cc2024"},
  {u:"MO1",    d:"Management Officer 1",   r:"MO",  pw:"mo2024"},
  {u:"MO2",    d:"Management Officer 2",   r:"MO",  pw:"mo2024"},
  {u:"MO3",    d:"Management Officer 3",   r:"MO",  pw:"mo2024"},
  {u:"MO4",    d:"Management Officer 4",   r:"MO",  pw:"mo2024"},
  {u:"DO1",    d:"Development Officer 1",  r:"DO",  pw:"do2024"},
  {u:"DO2",    d:"Development Officer 2",  r:"DO",  pw:"do2024"},
  {u:"STO KADUWELA",  d:"STO Kaduwela",   r:"STO", pw:"sto2024"},
  {u:"STO MAHARAGAMA",d:"STO Maharagama", r:"STO", pw:"sto2024"},
  {u:"STO NUGEGODA",  d:"STO Nugegoda",   r:"STO", pw:"sto2024"},
  {u:"STO KOLONNAWA", d:"STO Kolonnawa",  r:"STO", pw:"sto2024"},
  {u:"KADUWELA TO1",  d:"Kaduwela TO1",   r:"TO",  pw:"to2024"},
  {u:"KADUWELA TO2",  d:"Kaduwela TO2",   r:"TO",  pw:"to2024"},
  {u:"KADUWELA TO3",  d:"Kaduwela TO3",   r:"TO",  pw:"to2024"},
  {u:"KOLONNAWA TO1", d:"Kolonnawa TO1",  r:"TO",  pw:"to2024"},
  {u:"KOLONNAWA TO2", d:"Kolonnawa TO2",  r:"TO",  pw:"to2024"},
  {u:"NUGEGODA TO1",  d:"Nugegoda TO1",   r:"TO",  pw:"to2024"},
  {u:"NUGEGODA TO2",  d:"Nugegoda TO2",   r:"TO",  pw:"to2024"},
  {u:"MAHARAGAMA TO1",d:"Maharagama TO1", r:"TO",  pw:"to2024"},
  {u:"MAHARAGAMA TO2",d:"Maharagama TO2", r:"TO",  pw:"to2024"},
];

const EMPTY_STATE = {inL:[], outL:[], inC:1, outC:1};

// ═══════════════════════════════════════════════════════════════════════════
// STORAGE — localStorage (reliable, persistent per browser)
// Data export/import to Google Drive available via JSON backup
// ═══════════════════════════════════════════════════════════════════════════
function loadLS(key, fallback){
  try{ const v=localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch{ return fallback; }
}
function saveLS(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){
    if(e.name==='QuotaExceededError'){
      // Storage full — strip base64 file data from old letters
      console.warn("Storage quota exceeded, stripping old file data");
    }
    return false;
  }
}
function loadSession(){ return loadLS(LS_SESSION, null); }
function saveSession(u){ u ? saveLS(LS_SESSION, u) : localStorage.removeItem(LS_SESSION); }

// ═══════════════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════════════
function makeRef(type, count){
  const d = new Date();
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `DEO_Batt_${yy}_${mm}_${dd}_${type}_${String(count).padStart(3,'0')}`;
}
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—'; }
function fmtDT(d){ return d ? new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'; }
function uid(){ return crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Date.now().toString(36); }

// ═══════════════════════════════════════════════════════════════════════════
// REACTIVE STATE (simple pub-sub)
// ═══════════════════════════════════════════════════════════════════════════
let _state = {
  user: loadSession(),
  page: 'dash',
  appState: loadLS(LS_STATE, EMPTY_STATE),
  users: loadLS(LS_USERS, DEFAULT_USERS),
  saving: false,
  filterStatus: '',
  toasts: [],
  modals: [], // stack of modal configs
};
// Ensure defaults if loaded state is incomplete
_state.appState = {...EMPTY_STATE, ..._state.appState};

let _listeners = [];
function subscribe(fn){ _listeners.push(fn); return ()=>{ _listeners = _listeners.filter(l=>l!==fn); }; }
function getState(){ return _state; }
function setState(patch){
  _state = {..._state, ...patch};
  _listeners.forEach(l=>l(_state));
}

// ═══════════════════════════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════════════════════════
function saveAppState(newAS, msg='Saved.'){
  setState({appState: newAS, saving: true});
  const ok = saveLS(LS_STATE, newAS);
  setTimeout(()=>setState({saving:false}), 400);
  showToast(msg, ok ? 'ok' : 'err');
  return ok;
}

function saveUsers(newUsers){
  setState({users: newUsers});
  saveLS(LS_USERS, newUsers);
  showToast('User list saved.','ok');
}

function showToast(msg, type='ok'){
  const id = uid();
  setState({toasts:[..._state.toasts, {id, msg, type}]});
  setTimeout(()=>{
    setState({toasts: _state.toasts.filter(t=>t.id!==id)});
  }, 3500);
}

function login(userObj){ setState({user:userObj, page:'dash'}); saveSession(userObj); showToast(`Welcome, ${userObj.d}`,'ok'); }
function logout(){ setState({user:null, page:'dash', filterStatus:''}); saveSession(null); }

function addInLetter(letter){
  const as = _state.appState;
  saveAppState({...as, inL:[...as.inL, letter], inC: as.inC+1}, 'Incoming letter saved.');
}
function updateInLetter(id, patch){
  const as = _state.appState;
  saveAppState({...as, inL: as.inL.map(l=>l.id===id?{...l,...patch}:l)}, 'Letter updated.');
}
function addOutLetter(letter){
  const as = _state.appState;
  saveAppState({...as, outL:[...as.outL, letter], outC: as.outC+1}, 'Outgoing letter saved.');
}
function deleteInLetter(id){
  if(!confirm('Delete this letter? This cannot be undone.')) return;
  const as = _state.appState;
  saveAppState({...as, inL: as.inL.filter(l=>l.id!==id)}, 'Letter deleted.');
}
function deleteOutLetter(id){
  if(!confirm('Delete this letter? This cannot be undone.')) return;
  const as = _state.appState;
  saveAppState({...as, outL: as.outL.filter(l=>l.id!==id)}, 'Letter deleted.');
}

function exportData(){
  const data = {
    exportedAt: new Date().toISOString(),
    appState: _state.appState,
    users: _state.users,
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`LMS_Backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  showToast('Backup downloaded. Upload it to Google Drive folder.','ok');
}

function importData(file){
  const r = new FileReader();
  r.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      if(data.appState){ saveLS(LS_STATE, data.appState); setState({appState:{...EMPTY_STATE,...data.appState}}); }
      if(data.users){ saveLS(LS_USERS, data.users); setState({users: data.users}); }
      showToast('Data restored from backup.','ok');
    }catch{ showToast('Invalid backup file.','err'); }
  };
  r.readAsText(file);
}

// ═══════════════════════════════════════════════════════════════════════════
// RENDER ENGINE
// ═══════════════════════════════════════════════════════════════════════════
const app = document.getElementById('app');

function render(){
  const s = getState();
  if(!s.user){ renderLogin(); return; }
  renderApp();
}

subscribe(()=>{
  const s = getState();
  // Partial updates
  renderToasts();
  renderSaving();
  // Full re-render only if page or auth changed — otherwise partial
  const prev = app._lastPage;
  if(!app._lastPage || prev !== (s.user?.u || '') + s.page){
    app._lastPage = (s.user?.u || '') + s.page;
    render();
  } else {
    renderPageContent();
  }
});

// Initial render
render();

// ═══════════════════════════════════════════════════════════════════════════
// LOGIN PAGE
// ═══════════════════════════════════════════════════════════════════════════
function renderLogin(){
  app.innerHTML = `
  <div style="min-height:100vh;background:linear-gradient(135deg,#0a1628 0%,#102040 50%,#1a3060 100%);display:flex;align-items:center;justify-content:center;padding:16px">
    <div style="width:100%;max-width:420px">
      <div style="text-align:center;margin-bottom:28px">
        <div style="font-size:40px;margin-bottom:12px">🏛️</div>
        <div style="color:#fff;font-weight:800;font-size:22px;letter-spacing:-.5px">DE Office – Battaramulla</div>
        <div style="color:rgba(255,255,255,.45);font-size:13px;margin-top:4px">Letter Management System · Engineering Branch</div>
      </div>
      <div class="card">
        <div class="card-body">
          <div class="fg"><label class="lbl">Username</label><input class="inp" id="l-user" placeholder="e.g. DE, CC, MO1…" autofocus/></div>
          <div class="fg"><label class="lbl">Password</label><input class="inp" id="l-pass" type="password" placeholder="Password"/></div>
          <div id="l-err" style="display:none" class="alert alert-err" style="margin-bottom:12px"></div>
          <button class="btn btn-primary" style="width:100%;justify-content:center;padding:10px" onclick="doLogin()">Sign In →</button>
        </div>
      </div>
      <div style="text-align:center;color:rgba(255,255,255,.2);font-size:11px;margin-top:16px">© 2026 DE Office, Battaramulla</div>
    </div>
  </div>`;
  document.getElementById('l-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('l-user').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('l-pass').focus(); });
}

function doLogin(){
  const u = document.getElementById('l-user').value.trim();
  const p = document.getElementById('l-pass').value;
  const found = getState().users.find(x => x.u.toLowerCase()===u.toLowerCase());
  const errEl = document.getElementById('l-err');
  if(!found || found.pw !== p){
    errEl.style.display='flex'; errEl.textContent='⚠ Invalid username or password.'; return;
  }
  login({u:found.u, d:found.d, r:found.r});
}

function renderSaving(){

function toggleNotif(){
  const p = document.getElementById('notif-panel');
  if(!p) return;
  p.style.display = p.style.display==='none' ? 'block' : 'none';

  const mine = (appState.notifications||[]).filter(n=>n.to===user.u);
  const notifList = document.getElementById('notif-list');
  if(notifList){
    notifList.innerHTML = mine.length===0

function renderPageContent(){
  const el = document.getElementById('page-content');
  if(!el) return;
  const s = getState();
  const {page, user} = s;
  if(!user) return;

  const titles = {dash:'🏠 Dashboard', in:'📥 Incoming Letters', out:'📤 Outgoing Letters', rep:'📊 Reports', users:'👤 Manage Users'};
  const canOut = !['STO','TO'].includes(user.r);

  let content = '';
  if(page==='dash')  content = renderDash();
  else if(page==='in') content = renderInPage();
  else if(page==='out' && canOut) content = renderOutPage();
  else if(page==='rep' && ['DE','CC'].includes(user.r)) content = renderReports();
  else if(page==='users' && user.r==='DE') content = renderUsersPage();
  else content = `<div style="color:var(--text3);text-align:center;padding:40px">Access not available.</div>`;

  el.innerHTML = `<h2 style="font-size:16px;font-weight:800;color:var(--navy);margin-bottom:20px">${titles[page]||''}</h2>${content}`;
  attachPageEvents();
}

function renderDash(){
  const {appState, user} = getState();
  const {inL, outL} = appState;

  if(isAdmin){

    const ong = inL.filter(l=>l.status==='ongoing').length;

    return `
    <div class="stats-grid">
      ${statCard('Total In', tot, '#1a56db', "setPage('in')")}
      ${statCard('Pending Review', pde, '#e65100', "setPage('in');applyFilter('pending_de')")}
      ${statCard('DE Reviewed', reviewed, '#1565c0', "setPage('in');applyFilter('de_reviewed')")}
      ${statCard('Ongoing', ong, '#6a1b9a', "setPage('in');applyFilter('ongoing')")}
      ${statCard('Completed', done, '#059669', "setPage('in');applyFilter('done')")}
      ${statCard('Out Letters', outL.length, '#0369a1', "setPage('out')")}
    </div>
    ${pde>0?`<div class="alert alert-warn">⚡ <strong>${pde}</strong> letter${pde>1?'s':''} awaiting your review.</div>`:''}
    <div class="alert alert-info">💾 Data is stored in your browser. Use <strong>Export Backup</strong> in Reports to save to Google Drive.</div>
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="exportData()">📥 Export Backup (JSON)</button>
      <label class="btn btn-ghost btn-sm" style="cursor:pointer">📤 Import Backup <input type="file" accept=".json" style="display:none" onchange="importBackup(this)"></label>
      <a href="${DRIVE_FOLDER}" target="_blank" class="btn btn-success btn-sm">📁 Open Google Drive Folder</a>
    </div>`;
  } else {
    const my = inL.filter(l=>l.asgn.some(a=>a.u===user.u) && l.status!=='pending_de');
    const myPend = my.filter(l=>l.asgn.find(a=>a.u===user.u)?.s==='pending');
    const myOng  = my.filter(l=>l.asgn.find(a=>a.u===user.u)?.s==='ongoing');
    const myDone = my.filter(l=>l.asgn.find(a=>a.u===user.u)?.s==='done');
    return `
    <div class="stats-grid">
      ${statCard('Assigned to Me', my.length, '#1a56db', "setPage('in')")}
      ${statCard('My Pending', myPend.length, '#dc2626')}
      ${statCard('My Ongoing', myOng.length, '#6a1b9a')}
      ${statCard('My Done', myDone.length, '#059669')}
    </div>
    <div class="alert alert-info">Welcome, <strong>${escHtml(user.d)}</strong>. Click "In Letters" to view your assigned letters.</div>`;
  }
}

function statCard(label, val, color, onclick=''){
  return `<div class="stat-card${onclick?' clickable':''}" ${onclick?`onclick="${onclick}"`:''}
    style="border-left-color:${color}"
    onmouseenter="this.style.borderLeftColor='${color}'" >
    <div class="stat-val" style="color:${color}">${val}</div>
    <div class="stat-lbl">${label}</div>
    ${onclick?'<div style="font-size:10px;color:var(--text3);margin-top:3px">Click to view →</div>':''}
  </div>`;
}

window.exportData = exportData;

function renderInPage(){

  else if(!isAdmin) letters = letters.filter(l=>l.asgn.some(a=>a.u===user.u));

  return `
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;justify-content:space-between">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input class="inp" id="in-search" style="width:180px" placeholder="🔍 Search ref/subject/from…" value="" oninput="renderPageContent()"/>
      <select class="inp" id="in-status" style="width:170px" onchange="renderPageContent()">
        <option value="">All Status</option>
        <option value="pending_de" ${filterStatus==='pending_de'?'selected':''}>Pending DE Review</option>
        <option value="de_reviewed">DE Reviewed</option>
        <option value="ongoing">Ongoing</option>
        <option value="done">Done</option>
      </select>
      ${isAdmin?`<select class="inp" id="in-assignee" style="width:190px" onchange="renderPageContent()">
        <option value="">All Assignees</option>
        ${getState().users.filter(u=>u.u!=='DE').map(u=>`<option value="${escAttr(u.u)}">${escHtml(u.d)}</option>`).join('')}
      </select>`:''}
      <input type="date" class="inp" id="in-from" style="width:138px" onchange="renderPageContent()"/>
      <input type="date" class="inp" id="in-to" style="width:138px" onchange="renderPageContent()"/>
    </div>
    ${canUpload?`<button class="btn btn-primary" onclick="openUploadIn()">+ Upload Letter</button>`:''}
  </div>
  ${buildInTable(letters, user, isAdmin, isDE)}`;
}

function buildInTable(allLetters, user, isAdmin, isDE){
  // Apply filters from DOM
  const search = (document.getElementById('in-search')?.value||'').toLowerCase();
  const statusF = document.getElementById('in-status')?.value || getState().filterStatus || '';
  const assigneeF = document.getElementById('in-assignee')?.value || '';
  const fromDate = document.getElementById('in-from')?.value || '';
  const toDate   = document.getElementById('in-to')?.value || '';

  let ls = allLetters;
  if(search) ls = ls.filter(l=>
    l.ref.toLowerCase().includes(search) ||
    l.subj.toLowerCase().includes(search) ||
    l.from.toLowerCase().includes(search)
  );
  if(statusF) ls = ls.filter(l=>l.status===statusF);
  if(assigneeF) ls = ls.filter(l=>l.asgn.some(a=>a.u===assigneeF));
  if(fromDate) ls = ls.filter(l=>l.dr>=fromDate);
  if(toDate)   ls = ls.filter(l=>l.dr<=toDate);

  if(ls.length===0) return `<div style="text-align:center;color:var(--text3);padding:50px">No letters found.</div>`;

  return `<div class="table-wrap">
  <table>
    <thead><tr>
      <th>Ref No</th><th>Date</th><th>From</th><th>To</th><th>Subject</th>
      <th>Files</th><th>Assignees</th>
      ${isDE?'<th>Seen</th>':''}
      <th>Status</th><th>Actions</th>
    </tr></thead>
    <tbody>
    ${ls.map(l=>{
      const fc = countFiles(l);
      const allSeen = l.asgn.length>0 && l.asgn.every(a=>a.seen);
      const noneSeen = l.asgn.length>0 && l.asgn.every(a=>!a.seen);
      return `<tr onclick="openViewIn('${l.id}')">
        <td><strong style="color:var(--navy);font-family:var(--mono);font-size:12px">${escHtml(l.ref)}</strong></td>
        <td style="white-space:nowrap">${fmtDate(l.dr)}</td>
        <td>${escHtml(l.from)}</td>
        <td>${escHtml(l.to||'—')}</td>
        <td style="max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(l.subj)}</td>
        <td style="text-align:center">${fc>0?`<span style="background:#eff6ff;color:#1e40af;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">📎 ${fc}</span>`:'—'}</td>
        <td style="font-size:12px;max-width:180px">${l.asgn.length ? l.asgn.map(a=>`<span style="display:inline-block;background:var(--surface2);border-radius:4px;padding:1px 6px;font-size:11px;margin:1px">${escHtml(a.d)}</span>`).join('') : '—'}</td>
        ${isDE?`<td>${l.asgn.length===0?'—':allSeen?'<span class="seen-yes">✓ All</span>':noneSeen?'<span class="seen-no">✗ None</span>':'<span style="color:#d97706;font-size:11px;font-weight:600">⚑ Partial</span>'}</td>`:''}
        <td>${badge(l.status)}</td>
        <td onclick="event.stopPropagation()">
          <div style="display:flex;gap:6px">
            <button class="btn btn-primary btn-sm" onclick="openViewIn('${l.id}')">View</button>
            ${isAdmin?`<button class="btn btn-ghost btn-sm" onclick="openEditIn('${l.id}')">Edit</button>`:''}
            ${isAdmin?`<button class="btn btn-sm" style="background:#fee2e2;color:#dc2626;border:none" onclick="deleteInLetter('${l.id}')">Del</button>`:''}
          </div>
        </td>
      </tr>`;
    }).join('')}
    </tbody>
  </table></div>`;
}

      const fc = countFiles(l);

  return `
  <div class="alert alert-info" style="margin-bottom:16px">
    🔑 <strong>DE Only:</strong> Manage staff login credentials. Password changes take effect immediately.
  </div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
    <button class="btn btn-success" onclick="openAddUser()">+ Add New User</button>
  </div>

    return `<div style="margin-bottom:22px">
      <div style="font-weight:700;color:${roleColors[r]};font-size:13px;margin-bottom:10px;padding-bottom:5px;border-bottom:2px solid ${roleColors[r]}22">

window.submitUploadIn = function(){
  const {appState, user, users} = getState();
  const ref  = document.getElementById('ui-ref')?.value.trim() || makeRef('In', appState.inC);
  const date = document.getElementById('ui-date')?.value;
  const fromSel = document.getElementById('ui-from')?.value;
  const fromO   = document.getElementById('ui-fromO')?.value.trim();
  const toSel   = document.getElementById('ui-to')?.value;
  const toO     = document.getElementById('ui-toO')?.value.trim();
  const subj    = document.getElementById('ui-subj')?.value.trim();
  const desc    = document.getElementById('ui-desc')?.value.trim();
  const driveLink = document.getElementById('ui-drivelink')?.value.trim();

  if(!date||!fromSel||!subj){ showToast('Fill required: Date, From, Subject','err'); return; }

  const from = fromSel==='Others' ? fromO : fromSel;
  const to   = toSel==='Others' ? toO : toSel;

  // Assigned users
  const asgn = users.filter(u=>u.u!=='DE').filter(u=>{
    const ck = document.getElementById('ck-'+u.u);
    return ck && ck.checked;
  }).map(u=>({u:u.u, d:u.d, s:'pending', seen:null}));

  // Files
  const files = window._uploadFiles?.['ui-files'] || [];
  const attachments = [...files];
  if(driveLink){ attachments.push({fn:'Drive Link', driveUrl:driveLink, isDriveLink:true}); }

  const letter = {
    id: uid(), ref, dr:date, du:new Date().toISOString(), by:user.u,
    from, to: to||'DE', subj, desc, attachments,
    asgn, status: user.r==='DE' ? 'de_reviewed' : 'pending_de',
    note:'', deAt: user.r==='DE' ? new Date().toISOString() : null
  };

  addInLetter(letter);
  closeModal();
};

window.updateMyStatus = function(letterId, assigneeU, newStatus){
  const {appState} = getState();
  const l = appState.inL.find(x=>x.id===letterId);
  if(!l) return;
  const newAsgn = l.asgn.map(a=>a.u===assigneeU?{...a,s:newStatus}:a);
  const allDone = newAsgn.every(a=>a.s==='done');
  const anyOngoing = newAsgn.some(a=>a.s==='ongoing');
  let newStatus2 = l.status;
  if(!['pending_de'].includes(l.status)){
    newStatus2 = allDone ? 'done' : anyOngoing ? 'ongoing' : 'de_reviewed';
  }
  updateInLetter(letterId, {asgn:newAsgn, status:newStatus2});
};

window.submitUploadOut = function(){
  const {appState, user} = getState();
  const ref  = document.getElementById('uo-ref')?.value.trim() || makeRef('Out', appState.outC);
  const date = document.getElementById('uo-date')?.value;
  const toSel = document.getElementById('uo-to')?.value;
  const toO   = document.getElementById('uo-toO')?.value.trim();
  const subj  = document.getElementById('uo-subj')?.value.trim();
  const desc  = document.getElementById('uo-desc')?.value.trim();
  const driveLink = document.getElementById('uo-drivelink')?.value.trim();
  if(!date||!toSel||!subj){ showToast('Fill required: Date, To, Subject','err'); return; }
  const to = toSel==='Others'?toO:toSel;
  const files = window._uploadFiles?.['uo-files'] || [];
  const attachments = [...files];
  if(driveLink) attachments.push({fn:'Drive Link', driveUrl:driveLink, isDriveLink:true});
  const letter = {
    id:uid(), ref, ds:date, du:new Date().toISOString(), by:user.u,
    from:'DE Battaramulla', to, subj, desc, attachments
  };
  addOutLetter(letter);
  closeModal();
};

window.saveEditUser = function(username){
  const name = document.getElementById('eu-name')?.value.trim();
  const pw   = document.getElementById('eu-pw')?.value;
  const pw2  = document.getElementById('eu-pw2')?.value;
  const errEl = document.getElementById('eu-err');
  if(!name){ errEl.innerHTML='<div class="alert alert-err">Display name required.</div>'; return; }
  if(pw && pw.length<4){ errEl.innerHTML='<div class="alert alert-err">Password must be at least 4 characters.</div>'; return; }
  if(pw && pw!==pw2){ errEl.innerHTML='<div class="alert alert-err">Passwords do not match.</div>'; return; }
  const newUsers = getState().users.map(u=>u.u===username?{...u,d:name,...(pw?{pw}:{})}:u);
  saveUsers(newUsers);
  closeModal();
  renderPageContent();
};

window.submitAddUser = function(){
  const u  = document.getElementById('au-u')?.value.trim().toUpperCase();

// ═══════════════════════════════════════════════════════════════════════════
// MODAL ENGINE
// ═══════════════════════════════════════════════════════════════════════════
function showModal(title, body, maxW='780px'){
  const mc = document.getElementById('modal-container');
  if(!mc) return;
  mc.innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:${maxW}">
      <div class="modal-hd">
        <span class="modal-title">${title}</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">${body}</div>
    </div>
  </div>`;
  // Init file uploaders in modal
  setTimeout(()=>initFileUploaders(), 50);
}

window.closeModal = function(){
  const mc = document.getElementById('modal-container');
  if(mc) mc.innerHTML = '';
  window._uploadFiles = window._uploadFiles || {};
};

// ═══════════════════════════════════════════════════════════════════════════
// FILE UPLOADER
// ═══════════════════════════════════════════════════════════════════════════
window._uploadFiles = {};

function fileUploaderHTML(id){
  return `<div class="drop-zone" id="dz-${id}" onclick="document.getElementById('fi-${id}').click()">
    <div class="drop-icon">📁</div>
    <div class="drop-text">Click or drag &amp; drop files</div>
    <div class="drop-hint">Images, PDFs — multiple allowed</div>
    <input type="file" id="fi-${id}" multiple accept="image/*,.pdf,.doc,.docx" style="display:none"
      onchange="handleFileInput('${id}',this.files)"/>
  </div>
  <div id="chips-${id}" style="margin-top:6px;display:flex;flex-wrap:wrap"></div>`;
}

function initFileUploaders(){
  document.querySelectorAll('[id^="dz-"]').forEach(dz=>{
    const id = dz.id.replace('dz-','');
    if(!window._uploadFiles[id]) window._uploadFiles[id] = [];
    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
    dz.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('drag'); handleFileInput(id, e.dataTransfer.files); });
  });
}

window.handleFileInput = function(id, flist){
  if(!window._uploadFiles) window._uploadFiles = {};
  if(!window._uploadFiles[id]) window._uploadFiles[id] = [];
  Array.from(flist).forEach(file=>{
    const r = new FileReader();
    r.onload = ev => {
      window._uploadFiles[id].push({
        fd: ev.target.result.split(',')[1],
        fn: file.name,
        ft: file.type
      });
      updateChips(id);
    };
    r.readAsDataURL(file);
  });
};

function updateChips(id){
  const chips = document.getElementById('chips-'+id);
  if(!chips) return;
  const files = window._uploadFiles[id] || [];
  chips.innerHTML = files.map((f,i)=>`
    <span class="file-chip">
      ${f.ft?.startsWith('image/')?'🖼':'📄'} ${escHtml(f.fn)}
      <button class="file-chip-rm" onclick="removeFile('${id}',${i})">×</button>
    </span>`).join('');
}

window.removeFile = function(id, i){
  if(window._uploadFiles?.[id]){ window._uploadFiles[id].splice(i,1); updateChips(id); }
};

// ═══════════════════════════════════════════════════════════════════════════
// ATTACHMENTS VIEW
// ═══════════════════════════════════════════════════════════════════════════
function buildAttachmentsView(attachments){
  if(!attachments || !attachments.length) return '';
  return `<div style="margin:12px 0">
    <div style="font-weight:700;color:var(--navy);font-size:12px;margin-bottom:8px">📎 Attachments (${attachments.length})</div>
    <div style="display:grid;gap:8px">
      ${attachments.map((att,i)=>{
        if(att.isDriveLink || att.driveUrl){
          return `<div style="border:1px solid var(--border2);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:12px;background:var(--surface2)">
            <span style="font-size:24px">🔗</span>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:600">${escHtml(att.fn||'Drive File')}</div>
              <div style="font-size:11px;color:var(--text3)">Google Drive Link</div>
            </div>
            <a href="${escAttr(att.driveUrl||att.fileUrl||'')}" target="_blank" class="btn btn-success btn-sm">Open in Drive</a>
          </div>`;
        }
        if(att.fileUrl || att.fileId){
          const previewSrc = att.fileId
            ? `https://drive.google.com/file/d/${att.fileId}/preview`
            : (att.fileUrl?.match(/\/d\/([^/]+)/)?.[1]
                ? `https://drive.google.com/file/d/${att.fileUrl.match(/\/d\/([^/]+)/)[1]}/preview`
                : att.fileUrl);
          return `<div style="border:1px solid var(--border2);border-radius:var(--r);overflow:hidden">
            <iframe src="${escAttr(previewSrc)}" style="width:100%;height:220px;border:none;background:#f8f9fb"></iframe>
            <div style="padding:8px 12px;background:var(--surface2);display:flex;gap:10px;align-items:center">
              <span style="font-size:12px;color:var(--text2)">📎 ${escHtml(att.fn||`File ${i+1}`)}</span>
              <a href="${escAttr(previewSrc)}" target="_blank" class="btn btn-primary btn-sm">Full View</a>
            </div>
          </div>`;
        }
        if(!att.fd) return '';
        const src = `data:${att.ft};base64,${att.fd}`;
        return `<div style="border:1px solid var(--border2);border-radius:var(--r);overflow:hidden">
          ${att.ft?.startsWith('image/')
            ? `<img src="${src}" alt="${escAttr(att.fn)}" style="max-width:100%;max-height:280px;display:block;object-fit:contain;background:#f8f9fb"/>`
            : att.ft==='application/pdf'
            ? `<iframe src="${src}" style="width:100%;height:240px;border:none" title="${escAttr(att.fn)}"></iframe>`
            : `<div style="padding:12px;color:var(--text2);background:var(--surface2)">📄 ${escHtml(att.fn)} — preview not available</div>`
          }
          <div style="padding:8px 12px;background:var(--surface2);display:flex;gap:10px;align-items:center">
            <span style="font-size:12px;color:var(--text2)">📎 ${escHtml(att.fn)}</span>
            <a href="${src}" download="${escAttr(att.fn)}" class="btn btn-primary btn-sm">⬇ Download</a>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════════════════
function countFiles(l){
  return (l.attachments||[]).length || (l.fd ? 1 : 0);
}

function badge(status){
  const label = STATUS_LABELS[status] || status;
  return `<span class="badge badge-${status}">${label}</span>`;
}

function escHtml(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s){
  if(s==null) return '';
  return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\\/g,'\\\\');
}

window.deleteInLetter = deleteInLetter;
window.deleteOutLetter = deleteOutLetter;
window.renderPageContent = renderPageContent;
